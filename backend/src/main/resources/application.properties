spring.application.name=backend
spring.profiles.default=local

app.import.storage-dir=./uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=500MB

# Local PaddleOCR configuration for development. These paths are relative to the backend directory.
app.ocr.python-command=../ocr-service/.venv/Scripts/python.exe
app.ocr.script-path=../ocr-service/ocr_image.py
app.ocr.timeout-seconds=120

# Local Ollama configuration for turning OCR text into question drafts.
app.llm.base-url=http://127.0.0.1:11434
app.llm.model=qwen3:4b
app.llm.timeout-seconds=120
app.llm.max-output-tokens=4096
