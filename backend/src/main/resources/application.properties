spring.application.name=backend
spring.profiles.default=local

app.import.storage-dir=./uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=500MB

# Local PaddleOCR configuration for development. The Java backend starts the
# Python service on first use so its loaded OCR model can be reused.
app.ocr.python-command=../ocr-service/.venv/Scripts/python.exe
app.ocr.server-script-path=../ocr-service/ocr_server.py
app.ocr.service-port=8765
app.ocr.timeout-seconds=120
app.ocr.startup-timeout-seconds=90

# DeepSeek configuration for turning OCR or Word text into question drafts.
# The API Key comes only from the computer environment variable, never from
# the mobile app or a committed configuration file.
app.llm.base-url=https://api.deepseek.com
app.llm.api-key=${DEEPSEEK_API_KEY:}
app.llm.model=deepseek-v4-flash
app.llm.timeout-seconds=180
# A Word chunk usually contains about three questions. This limit avoids
# truncating a complete JSON response while billing only for tokens actually used.
app.llm.max-output-tokens=4096

# The real signing secret lives in application-local.properties or APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.access-token-expires-in-seconds=7200
